<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dignity OS — Program Guide</title>
<style>
  /* ============================================================
     DIGNITY OS · Electronic Program Guide
     Set-top box firmware UI simulation (concept design)
     Symbol-driven interface — minimal text by design
     ============================================================ */

  :root {
    --bg-deep:    #0d0a1f;
    --bg-panel:   #1a1440;
    --bg-cell:    #241b58;
    --bg-cell-2:  #2d2270;
    --ink:        #e8e4ff;
    --ink-dim:    #8d84c6;
    --accent:     #35e0d0;
    --accent-2:   #ffb03a;
    --hot:        #ff5d8f;
    --now-line:   #ffb03a;
    --glass:      rgba(255,255,255,.06);
    --radius:     14px;
    font-size: clamp(10px, 1.25vmin, 16px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Segoe UI", "Hiragino Sans", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---- TV bezel / screen ---- */
  #screen {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 90% at 50% -10%, #2b2166 0%, var(--bg-deep) 55%, #070512 100%);
    overflow: hidden;
  }

  /* CRT scanlines + vignette */
  #screen::after {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px),
      radial-gradient(130% 130% at 50% 50%, transparent 60%, rgba(0,0,0,.45) 100%);
    z-index: 90;
  }

  /* soft ambient drift behind everything */
  .aurora {
    position: absolute; inset: -20%;
    background:
      radial-gradient(30% 40% at 20% 30%, rgba(53,224,208,.10), transparent 70%),
      radial-gradient(35% 45% at 80% 20%, rgba(255,93,143,.09), transparent 70%),
      radial-gradient(40% 50% at 60% 85%, rgba(255,176,58,.07), transparent 70%);
    animation: drift 26s ease-in-out infinite alternate;
    z-index: 0;
  }
  @keyframes drift {
    from { transform: translate(-2%, -1%) scale(1); }
    to   { transform: translate(2%, 2%) scale(1.06); }
  }

  /* ============================================================
     BOOT SEQUENCE
     ============================================================ */
  #boot {
    position: absolute; inset: 0;
    background: #05040e;
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    transition: opacity .9s ease;
  }
  #boot.done { opacity: 0; pointer-events: none; }

  .boot-mark { text-align: center; }

  .boot-orbits {
    position: relative;
    width: 16rem; height: 16rem;
    margin: 0 auto 2rem;
  }
  .boot-orbits svg { width: 100%; height: 100%; overflow: visible; }

  .orbit-ring {
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    transform-origin: 60px 60px;
    stroke-dasharray: 240 140;
    animation: spin 3.2s cubic-bezier(.65,.05,.35,.95) infinite;
  }
  .orbit-ring.r1 { stroke: var(--accent);   animation-duration: 3.2s; }
  .orbit-ring.r2 { stroke: var(--hot);      animation-duration: 4.1s; animation-direction: reverse; }
  .orbit-ring.r3 { stroke: var(--accent-2); animation-duration: 5.3s; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .boot-core {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .boot-core .d-mark {
    width: 6rem; height: 6rem;
    animation: corePulse 1.6s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 1.4rem rgba(53,224,208,.55));
  }
  @keyframes corePulse {
    from { transform: scale(.94); }
    to   { transform: scale(1.06); }
  }

  .boot-word {
    letter-spacing: 1.1rem;
    text-indent: 1.1rem;
    font-size: 2rem;
    font-weight: 200;
    color: var(--ink);
    opacity: 0;
    animation: wordIn 1.4s .6s ease forwards;
  }
  .boot-sub {
    margin-top: .8rem;
    letter-spacing: .55rem;
    text-indent: .55rem;
    font-size: .68rem;
    color: var(--ink-dim);
    opacity: 0;
    animation: wordIn 1.4s 1.2s ease forwards;
  }
  @keyframes wordIn {
    from { opacity: 0; transform: translateY(.8rem); letter-spacing: 1.6rem; }
    to   { opacity: 1; transform: none; }
  }

  .boot-progress {
    width: 14rem; height: .25rem;
    margin: 2.4rem auto 0;
    border-radius: 99px;
    background: rgba(255,255,255,.08);
    overflow: hidden;
  }
  .boot-progress i {
    display: block; height: 100%; width: 0;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), var(--hot));
    animation: load 2.8s .4s cubic-bezier(.3,.8,.4,1) forwards;
  }
  @keyframes load { to { width: 100%; } }

  /* ============================================================
     MAIN GUIDE LAYOUT
     ============================================================ */
  #guide {
    position: absolute; inset: 0;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    gap: 1rem;
    padding: 2.2rem 2.6rem 1.6rem;
    z-index: 10;
    opacity: 0;
    transform: scale(1.03);
    transition: opacity .8s ease, transform .8s ease;
  }
  #guide.on { opacity: 1; transform: none; }

  /* ---- Top bar ---- */
  .topbar {
    display: flex; align-items: center; gap: 1.4rem;
  }
  .logo-lockup {
    display: flex; align-items: center; gap: .8rem;
  }
  .logo-lockup .d-mark { width: 2.6rem; height: 2.6rem; }
  .logo-lockup .word {
    font-weight: 200; letter-spacing: .5rem; font-size: 1.15rem; color: var(--ink);
  }

  .topbar .spacer { flex: 1; }

  .status-glyphs {
    display: flex; align-items: center; gap: 1rem;
    color: var(--ink-dim);
  }
  .status-glyphs svg { width: 1.5rem; height: 1.5rem; display: block; }

  #clock {
    font-variant-numeric: tabular-nums;
    font-size: 1.7rem; font-weight: 300;
    color: var(--ink);
    letter-spacing: .1rem;
  }
  #clock small { font-size: .85rem; color: var(--accent); margin-left: .3rem; }

  /* ---- Now-playing strip: preview + info ---- */
  .nowstrip {
    display: grid;
    grid-template-columns: 22rem 1fr;
    gap: 1.2rem;
    align-items: stretch;
  }

  .preview {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    aspect-ratio: 16/9;
    background: #000;
    box-shadow: 0 .8rem 2.4rem rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.09);
  }
  .preview canvas { width: 100%; height: 100%; display: block; }
  .preview .ch-badge {
    position: absolute; left: .7rem; top: .7rem;
    display: flex; align-items: center; gap: .45rem;
    padding: .3rem .7rem;
    border-radius: 99px;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(6px);
    color: #fff; font-size: .85rem; font-weight: 600;
    letter-spacing: .05rem;
  }
  .preview .live-dot {
    width: .55rem; height: .55rem; border-radius: 50%;
    background: var(--hot);
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity: .25; } }

  .infocard {
    border-radius: var(--radius);
    background: linear-gradient(160deg, var(--glass), rgba(255,255,255,.02));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    padding: 1.1rem 1.5rem;
    display: flex; flex-direction: column; justify-content: center;
    gap: .55rem;
    min-width: 0;
  }
  .infocard .row1 {
    display: flex; align-items: center; gap: .9rem; min-width: 0;
  }
  .infocard .genre-sym {
    width: 2.4rem; height: 2.4rem; flex: none;
    display: grid; place-items: center;
    border-radius: .7rem;
  }
  .infocard .genre-sym svg { width: 1.5rem; height: 1.5rem; }
  .infocard h1 {
    font-size: 1.55rem; font-weight: 500; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0;
  }
  .infocard .meta {
    display: flex; align-items: center; gap: 1rem;
    color: var(--ink-dim); font-size: .95rem;
    font-variant-numeric: tabular-nums;
  }
  .infocard .meta .sym { display: inline-flex; align-items: center; gap: .35rem; }
  .infocard .meta svg { width: 1.05rem; height: 1.05rem; }

  .progressbar {
    height: .35rem; border-radius: 99px;
    background: rgba(255,255,255,.09);
    overflow: hidden;
  }
  .progressbar i {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: inherit;
    transition: width .6s ease;
  }

  /* ---- EPG grid ---- */
  .gridwrap {
    position: relative;
    border-radius: var(--radius);
    background: rgba(0,0,0,.25);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
    overflow: hidden;
    display: grid;
    grid-template-rows: auto 1fr;
    min-height: 0;
  }

  /* timeline header */
  .timeline {
    display: grid;
    grid-template-columns: 13rem 1fr;
    border-bottom: 1px solid rgba(255,255,255,.07);
    background: rgba(255,255,255,.03);
  }
  .timeline .corner {
    display: flex; align-items: center; justify-content: center;
    padding: .6rem;
  }
  .timeline .corner svg { width: 1.4rem; height: 1.4rem; color: var(--accent); }
  .timeslots { display: grid; grid-template-columns: repeat(4, 1fr); }
  .timeslots .slot {
    padding: .6rem .9rem;
    font-size: .95rem; font-weight: 600;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
    border-left: 1px solid rgba(255,255,255,.05);
    letter-spacing: .05rem;
  }
  .timeslots .slot.now { color: var(--accent-2); }

  /* rows viewport */
  #rows {
    position: relative;
    overflow: hidden;
    min-height: 0;
  }
  #rowsInner {
    position: absolute; inset: 0 0 auto 0;
    transition: transform .35s cubic-bezier(.25,.9,.3,1.1);
  }

  .ch-row {
    display: grid;
    grid-template-columns: 13rem 1fr;
    height: 5.4rem;
    border-bottom: 1px solid rgba(255,255,255,.05);
  }

  .ch-label {
    display: flex; align-items: center; gap: .8rem;
    padding: 0 1rem;
    background: rgba(255,255,255,.025);
  }
  .ch-num {
    font-size: .8rem; font-weight: 700;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
    width: 2rem; text-align: right;
  }
  .ch-logo {
    width: 3rem; height: 3rem; flex: none;
    border-radius: .8rem;
    display: grid; place-items: center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
  }
  .ch-logo svg { width: 1.8rem; height: 1.8rem; }
  .ch-name {
    font-size: .78rem; font-weight: 600; letter-spacing: .05rem;
    color: var(--ink-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0;
  }

  .ch-programs { position: relative; }

  .prog {
    position: absolute; top: .45rem; bottom: .45rem;
    border-radius: .8rem;
    background: linear-gradient(160deg, var(--bg-cell-2), var(--bg-cell));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.07);
    padding: .55rem .9rem;
    display: flex; flex-direction: column; justify-content: center;
    gap: .2rem;
    overflow: hidden;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .prog .p-title {
    font-size: .95rem; font-weight: 600; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .prog .p-syms {
    display: flex; align-items: center; gap: .5rem;
    color: var(--ink-dim);
  }
  .prog .p-syms svg { width: .95rem; height: .95rem; }
  .prog .p-time {
    font-size: .72rem; color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }

  .prog.onair {
    background: linear-gradient(160deg, #33307e, #262060);
    box-shadow: inset 0 0 0 1px rgba(53,224,208,.28);
  }

  .prog.sel {
    background: linear-gradient(160deg, #3ee7d6, #19b3a6);
    box-shadow:
      0 .5rem 1.6rem rgba(53,224,208,.35),
      inset 0 0 0 2px rgba(255,255,255,.85);
    transform: scale(1.035);
    z-index: 5;
    animation: selGlow 1.5s ease-in-out infinite alternate;
  }
  .prog.sel .p-title { color: #06251f; }
  .prog.sel .p-time, .prog.sel .p-syms { color: #0b4b41; }
  @keyframes selGlow {
    from { box-shadow: 0 .5rem 1.6rem rgba(53,224,208,.3),  inset 0 0 0 2px rgba(255,255,255,.85); }
    to   { box-shadow: 0 .5rem 2.2rem rgba(53,224,208,.55), inset 0 0 0 2px #fff; }
  }

  /* now-line */
  #nowline {
    position: absolute; top: 0; bottom: 0;
    width: 2px;
    background: var(--now-line);
    box-shadow: 0 0 .6rem var(--now-line);
    z-index: 8;
    pointer-events: none;
  }
  #nowline::before {
    content: "";
    position: absolute; top: -1px; left: 50%;
    transform: translateX(-50%);
    border: .45rem solid transparent;
    border-top-color: var(--now-line);
  }

  /* ---- Bottom control legend: pure symbols ---- */
  .legend {
    display: flex; align-items: center; justify-content: center;
    gap: 2.6rem;
  }
  .legend .hint {
    display: flex; align-items: center; gap: .6rem;
    color: var(--ink-dim);
  }
  .legend .btn {
    width: 2.1rem; height: 2.1rem;
    border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 700; font-size: .95rem;
    color: #fff;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.4);
  }
  .btn.a { background: #2fbfae; }
  .btn.b { background: #e4485c; }
  .btn.x { background: #4a7dff; }
  .btn.y { background: #f0a530; }
  .btn.pad {
    background: #3a3564; border-radius: .5rem;
  }
  .legend .hint svg { width: 1.3rem; height: 1.3rem; }

  /* ============================================================
     DETAIL OVERLAY (A button)
     ============================================================ */
  #detail {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(5,4,14,.62);
    backdrop-filter: blur(10px);
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  #detail.on { opacity: 1; pointer-events: auto; }

  .detail-card {
    width: min(46rem, 82vw);
    border-radius: 1.4rem;
    background: linear-gradient(165deg, #241d5c, #14103a);
    box-shadow: 0 2rem 5rem rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.12);
    padding: 2rem 2.4rem;
    transform: translateY(1.6rem) scale(.96);
    transition: transform .3s cubic-bezier(.2,.9,.3,1.2);
  }
  #detail.on .detail-card { transform: none; }

  .detail-card .head {
    display: flex; align-items: center; gap: 1rem; margin-bottom: 1.1rem;
  }
  .detail-card .genre-sym {
    width: 3.2rem; height: 3.2rem; flex: none;
    border-radius: .9rem; display: grid; place-items: center;
  }
  .detail-card .genre-sym svg { width: 2rem; height: 2rem; }
  .detail-card h2 { font-size: 1.7rem; font-weight: 500; color: var(--ink); min-width: 0; }
  .detail-card .times {
    color: var(--accent); font-variant-numeric: tabular-nums;
    font-size: 1rem; letter-spacing: .06rem;
  }
  .detail-card p {
    color: var(--ink-dim); line-height: 1.65; font-size: 1rem;
    margin-top: .9rem;
  }
  .detail-card .symrow {
    margin-top: 1.4rem;
    display: flex; gap: .8rem;
  }
  .symrow .chip {
    display: inline-flex; align-items: center; gap: .45rem;
    padding: .45rem .95rem;
    border-radius: 99px;
    background: rgba(255,255,255,.07);
    color: var(--ink); font-size: .85rem; font-weight: 600;
  }
  .symrow .chip svg { width: 1.1rem; height: 1.1rem; }

  .detail-actions {
    margin-top: 1.8rem;
    display: flex; gap: 1rem;
  }
  .detail-actions .act {
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: .6rem;
    padding: .85rem;
    border-radius: .9rem;
    background: rgba(255,255,255,.06);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
    color: var(--ink);
    cursor: pointer;
    transition: background .15s ease, transform .15s ease;
  }
  .detail-actions .act:hover { background: rgba(53,224,208,.18); transform: translateY(-2px); }
  .detail-actions .act svg { width: 1.4rem; height: 1.4rem; }

  /* channel-change flash */
  #flash {
    position: absolute; inset: 0;
    background: #fff;
    opacity: 0; pointer-events: none;
    z-index: 80;
  }
  #flash.zap { animation: zap .35s ease; }
  @keyframes zap { 0% { opacity: .55; } 100% { opacity: 0; } }
</style>
</head>
<body>

<div id="screen">
  <div class="aurora"></div>

  <!-- ══════════ BOOT ══════════ -->
  <div id="boot">
    <div class="boot-mark">
      <div class="boot-orbits">
        <svg viewBox="0 0 120 120">
          <circle class="orbit-ring r1" cx="60" cy="60" r="56"/>
          <circle class="orbit-ring r2" cx="60" cy="60" r="46"/>
          <circle class="orbit-ring r3" cx="60" cy="60" r="36"/>
        </svg>
        <div class="boot-core">
          <svg class="d-mark" viewBox="0 0 48 48">
            <defs>
              <linearGradient id="dg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#35e0d0"/>
                <stop offset="1" stop-color="#4a7dff"/>
              </linearGradient>
            </defs>
            <path fill="url(#dg)" d="M12 6h12c10 0 18 8 18 18s-8 18-18 18H12V6zm8 8v20h4c5.5 0 10-4.5 10-10s-4.5-10-10-10h-4z"/>
          </svg>
        </div>
      </div>
      <div class="boot-word">DIGNITY</div>
      <div class="boot-sub">DIGITAL · INTELLIGENCE · GENERATIONS · NOW · IN · THE · YIELD</div>
      <div class="boot-progress"><i></i></div>
    </div>
  </div>

  <!-- ══════════ GUIDE ══════════ -->
  <div id="guide">

    <!-- top bar -->
    <div class="topbar">
      <div class="logo-lockup">
        <svg class="d-mark" viewBox="0 0 48 48">
          <path fill="#35e0d0" d="M12 6h12c10 0 18 8 18 18s-8 18-18 18H12V6zm8 8v20h4c5.5 0 10-4.5 10-10s-4.5-10-10-10h-4z"/>
        </svg>
        <span class="word">DIGNITY</span>
      </div>
      <div class="spacer"></div>
      <div class="status-glyphs">
        <!-- signal -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 18v-4M9 18v-8M14 18V6M19 18V2" stroke="#35e0d0"/>
        </svg>
        <!-- satellite dish -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 10a8 8 0 0 0 10 10L4 10z"/><path d="M9 15l3-3"/><circle cx="17" cy="7" r="1.6" fill="currentColor" stroke="none"/><path d="M14 4a6 6 0 0 1 6 6" opacity=".6"/>
        </svg>
        <!-- rec dot -->
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#ff5d8f"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle></svg>
      </div>
      <div id="clock">--:--<small>--</small></div>
    </div>

    <!-- now playing -->
    <div class="nowstrip">
      <div class="preview">
        <canvas id="pv" width="480" height="270"></canvas>
        <div class="ch-badge"><span class="live-dot"></span><span id="pvBadge">CH 01</span></div>
      </div>
      <div class="infocard">
        <div class="row1">
          <div class="genre-sym" id="npSym"></div>
          <h1 id="npTitle">—</h1>
        </div>
        <div class="meta">
          <span class="sym" id="npTime">—</span>
          <span class="sym" id="npFlags"></span>
        </div>
        <div class="progressbar"><i id="npProg" style="width:0%"></i></div>
      </div>
    </div>

    <!-- grid -->
    <div class="gridwrap">
      <div class="timeline">
        <div class="corner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>
          </svg>
        </div>
        <div class="timeslots" id="timeslots"></div>
      </div>
      <div id="rows">
        <div id="rowsInner"></div>
        <div id="nowline"></div>
      </div>
    </div>

    <!-- symbol legend -->
    <div class="legend">
      <div class="hint">
        <span class="btn pad">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l3 4H9l3-4zm0 18l-3-4h6l-3 4zM3 12l4-3v6l-4-3zm18 0l-4 3V9l4 3z"/></svg>
        </span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7" opacity=".0"/><rect x="4" y="6" width="7" height="5" rx="1.2"/><rect x="13" y="6" width="7" height="5" rx="1.2" opacity=".45"/><rect x="4" y="13" width="7" height="5" rx="1.2" opacity=".45"/><rect x="13" y="13" width="7" height="5" rx="1.2" opacity=".45"/></svg>
      </div>
      <div class="hint">
        <span class="btn a">A</span>

  star: GENRES.kids.path,
};

const FLAG_SYMS = {
  hd:  '<rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M7 9.5v5M10 9.5v5M7 12h3M13.5 9.5v5h2a2.5 2.5 0 0 0 0-5h-2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
  cc:  '<rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 10.2a2 2 0 1 0 0 3.6M16 10.2a2 2 0 1 0 0 3.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
  st:  '<path d="M4 14a4 4 0 0 1 4-4c3 0 5 4 8 4a4 4 0 0 0 4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M4 10a4 4 0 0 1 4-4c3 0 5 4 8 4a4 4 0 0 0 4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" opacity=".5"/>',
};

function genreSVG(g)   { return `<svg viewBox="0 0 24 24">${(GENRES[g]||GENRES.doc).path}</svg>`; }
function chGlyphSVG(g) { return `<svg viewBox="0 0 24 24">${CH_GLYPHS[g]||CH_GLYPHS.tv}</svg>`; }
function flagSVG(f)    { return `<svg viewBox="0 0 24 24">${FLAG_SYMS[f]}</svg>`; }
function genreTint(g, a=1, l=60) { const h=(GENRES[g]||GENRES.doc).hue; return `hsla(${h} 75% ${l}% / ${a})`; }

/* ---------- audio: synthesized firmware UI sounds ---------- */
const AudioFX = (() => {
  let ctx = null;
  const ac = () => (ctx ||= new (window.AudioContext || window.webkitAudioContext)());

  function tone(freq, t0, dur, type='sine', gain=.16, glideTo=null) {
    const c = ac(), o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, c.currentTime + t0);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, c.currentTime + t0 + dur);
    g.gain.setValueAtTime(0, c.currentTime + t0);
    g.gain.linearRampToValueAtTime(gain, c.currentTime + t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0008, c.currentTime + t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + .05);
  }

  return {
    unlock() { try { ac().resume(); } catch(e){} },
    move()   { tone(1240, 0, .07, 'square', .05); },
    moveV()  { tone(980,  0, .07, 'square', .05); },
    select() { tone(660, 0, .12, 'triangle', .14); tone(990, .07, .16, 'triangle', .12); tone(1320, .14, .22, 'sine', .1); },
    back()   { tone(880, 0, .1, 'triangle', .12); tone(587, .07, .16, 'triangle', .1); },
    zap()    { tone(300, 0, .16, 'sawtooth', .07, 1800); tone(1800, .1, .12, 'sine', .06, 600); },
    denied() { tone(220, 0, .12, 'square', .08); tone(207, .1, .16, 'square', .08); },
    boot() {
      // rising firmware chime: soft fifth-stack arpeggio with shimmer
      const seq = [[392,0,.7],[523.25,.18,.8],[659.25,.36,.9],[783.99,.54,1.2],[1567.98,.8,1.4]];
      seq.forEach(([f,t,d]) => { tone(f, t, d, 'sine', .12); tone(f*2, t+.02, d*.6, 'sine', .035); });
      tone(98, .0, 1.6, 'triangle', .07);
    },
    chirp()  { tone(1568, 0, .09, 'sine', .09); tone(2093, .06, .12, 'sine', .07); },
  };
})();

/* ---------- parse XML source ----------
   Event start/dur are in 30-minute grid units;
   24 units = a 12-hour listing window. */
const xmlDoc = new DOMParser().parseFromString(
  document.getElementById('epg-xml').textContent, 'text/xml');

const channels = [...xmlDoc.querySelectorAll('service')].map(s => ({
  num:   s.getAttribute('num'),
  id:    s.getAttribute('id'),
  name:  s.getAttribute('name'),
  hue:   +s.getAttribute('hue'),
  glyph: s.getAttribute('glyph'),
  events: [...s.querySelectorAll('event')].map(e => ({
    start: +e.getAttribute('start'),     // half-slot units from window start
    dur:   +e.getAttribute('dur'),
    genre: e.getAttribute('genre'),
    title: e.getAttribute('title'),
    desc:  e.getAttribute('desc'),
    flags: ['hd', ...(Math.random() > .4 ? ['st'] : ['cc'])],
  })),
}));

/* ---------- time model ----------
   Guide window: 2 hours visible (4 columns of 30 min).
   XML timeline: 24 half-slot units = 12 h, anchored so "now"
   sits inside the first visible window. */
const UNITS_TOTAL = 24;
const UNIT_MIN = 30;

const nowReal = new Date();
const anchor = new Date(nowReal);        // window start = top of current hour, minus 30min
anchor.setMinutes(nowReal.getMinutes() < 30 ? 0 : 30, 0, 0);
const windowStart = new Date(anchor.getTime() - 30 * 60000);  // one slot of history

function unitToDate(u) { return new Date(windowStart.getTime() + u * UNIT_MIN * 60000); }
function fmtHM(d) {
  let h = d.getHours(), m = d.getMinutes();
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function nowUnits() { return (Date.now() - windowStart.getTime()) / (UNIT_MIN * 60000); }

/* ---------- state ---------- */
const VISIBLE_UNITS = 4;                 // 4 × 30 min = 2 h on screen
const state = {
  ch: 0,                                 // selected channel index
  ev: 0,                                 // selected event index within channel
  t0: 0,                                 // left edge of visible window, in units
  tuned: 0,                              // channel playing in preview
  detailOpen: false,
  booted: false,
};

/* ---------- build grid DOM ---------- */
const rowsInner = document.getElementById('rowsInner');
const timeslots = document.getElementById('timeslots');

function currentEventIndex(ch) {
  const n = nowUnits();
  const evs = channels[ch].events;
  for (let i = 0; i < evs.length; i++)
    if (n >= evs[i].start && n < evs[i].start + evs[i].dur) return i;
  return 0;
}

function renderTimeslots() {
  timeslots.innerHTML = '';
  const n = nowUnits();
  for (let i = 0; i < VISIBLE_UNITS; i++) {
    const u = state.t0 + i;
    const d = unitToDate(u);
    const el = document.createElement('div');
    el.className = 'slot' + (n >= u && n < u + 1 ? ' now' : '');
    el.textContent = fmtHM(d);
    timeslots.appendChild(el);
  }
}

function renderRows() {
  rowsInner.innerHTML = '';
  channels.forEach((ch, ci) => {
    const row = document.createElement('div');
    row.className = 'ch-row';

    const label = document.createElement('div');
    label.className = 'ch-label';
    label.innerHTML = `
      <span class="ch-num">${ch.num}</span>
      <span class="ch-logo" style="background:hsla(${ch.hue} 70% 55% / .18); color:hsl(${ch.hue} 80% 68%)">${chGlyphSVG(ch.glyph)}</span>
      <span class="ch-name">${ch.name}</span>`;
    row.appendChild(label);

    const lane = document.createElement('div');
    lane.className = 'ch-programs';
    const n = nowUnits();

    ch.events.forEach((ev, ei) => {
      const evEnd = ev.start + ev.dur;
      if (evEnd <= state.t0 || ev.start >= state.t0 + VISIBLE_UNITS) return;

      const clipStart = Math.max(ev.start, state.t0);
      const clipEnd   = Math.min(evEnd, state.t0 + VISIBLE_UNITS);
      const leftPct   = (clipStart - state.t0) / VISIBLE_UNITS * 100;
      const widPct    = (clipEnd - clipStart) / VISIBLE_UNITS * 100;

      const cell = document.createElement('div');
      cell.className = 'prog'
        + (n >= ev.start && n < evEnd ? ' onair' : '')
        + (ci === state.ch && ei === state.ev ? ' sel' : '');
      cell.style.left  = `calc(${leftPct}% + .25rem)`;
      cell.style.width = `calc(${widPct}% - .5rem)`;
      cell.dataset.ch = ci; cell.dataset.ev = ei;

      const flags = ev.flags.map(flagSVG).join('');
      cell.innerHTML = `
        <div class="p-title">${ev.title}</div>
        <div class="p-syms">
          <span style="color:${genreTint(ev.genre, .9, 65)}">${genreSVG(ev.genre)}</span>
          ${flags}
          <span class="p-time">${fmtHM(unitToDate(ev.start))}–${fmtHM(unitToDate(evEnd))}</span>
        </div>`;

      cell.addEventListener('click', () => {
        AudioFX.unlock();
        if (ci === state.ch && ei === state.ev) { openDetail(); }
        else { state.ch = ci; state.ev = ei; AudioFX.move(); refresh(); }
      });
      lane.appendChild(cell);
    });

    row.appendChild(lane);
    rowsInner.appendChild(row);
  });

  // vertical scroll: keep selected row in view (5 rows fit)
  const rowH = rowsInner.querySelector('.ch-row')?.offsetHeight || 0;
  const viewH = document.getElementById('rows').offsetHeight;
  const fit = Math.max(1, Math.floor(viewH / rowH));
  const topIdx = Math.min(Math.max(0, state.ch - Math.floor(fit / 2)), Math.max(0, channels.length - fit));
  rowsInner.style.transform = `translateY(${-topIdx * rowH}px)`;
}

function renderNowline() {
  const el = document.getElementById('nowline');
  const n = nowUnits();
  if (n < state.t0 || n > state.t0 + VISIBLE_UNITS) { el.style.display = 'none'; return; }
  el.style.display = '';
  const labelW = 13;   // rem, matches grid-template
  const rows = document.getElementById('rows');
  const remPx = parseFloat(getComputedStyle(document.documentElement).fontSize);
  const laneW = rows.offsetWidth - labelW * remPx;
  el.style.left = `${labelW * remPx + (n - state.t0) / VISIBLE_UNITS * laneW}px`;
}

/* ---------- now-playing panel + preview ---------- */
function renderNowPlaying() {
  const ch = channels[state.tuned];
  const ei = currentEventIndex(state.tuned);
  const ev = ch.events[ei];
  const n = nowUnits();

  document.getElementById('pvBadge').textContent = `CH ${ch.num}`;
  document.getElementById('npTitle').textContent = ev.title;
  const sym = document.getElementById('npSym');
  sym.style.background = genreTint(ev.genre, .18, 55);
  sym.style.color = genreTint(ev.genre, 1, 68);
  sym.innerHTML = genreSVG(ev.genre);

  document.getElementById('npTime').textContent =
    `${fmtHM(unitToDate(ev.start))} – ${fmtHM(unitToDate(ev.start + ev.dur))}`;
  document.getElementById('npFlags').innerHTML = ev.flags.map(flagSVG).join(' ');

  const pct = Math.min(100, Math.max(0, (n - ev.start) / ev.dur * 100));
  document.getElementById('npProg').style.width = pct + '%';
}

/* preview canvas: animated faux-broadcast (color drift + shapes) */
const pv = document.getElementById('pv');
const px = pv.getContext('2d');
let pvT = 0, staticUntil = 0;

function drawPreview() {
  pvT += 0.016;
  const w = pv.width, h = pv.height;
  const hue = channels[state.tuned].hue;

  if (performance.now() < staticUntil) {
    // channel-change static burst
    const img = px.createImageData(w, h);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() * 255;
      img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255;
    }
    px.putImageData(img, 0, 0);
  } else {
    const g = px.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, `hsl(${hue + Math.sin(pvT*.5)*14} 55% ${16 + Math.sin(pvT*.8)*4}%)`);
    g.addColorStop(1, `hsl(${hue + 40} 60% 8%)`);
    px.fillStyle = g; px.fillRect(0, 0, w, h);

    // drifting bokeh discs
    for (let i = 0; i < 7; i++) {
      const a = pvT * (.25 + i * .07) + i * 1.7;
      const x = w/2 + Math.cos(a) * (60 + i * 26);
      const y = h/2 + Math.sin(a * 1.3) * (36 + i * 12);
      px.beginPath();
      px.arc(x, y, 14 + i * 7, 0, 7);
      px.fillStyle = `hsla(${hue + i*18} 80% 62% / ${.10 - i*.008})`;
      px.fill();
    }
    // sweeping highlight bar
    const sx = ((pvT * 40) % (w + 200)) - 100;
    const sg = px.createLinearGradient(sx - 60, 0, sx + 60, 0);
    sg.addColorStop(0, 'transparent');
    sg.addColorStop(.5, 'rgba(255,255,255,.05)');
    sg.addColorStop(1, 'transparent');
    px.fillStyle = sg; px.fillRect(0, 0, w, h);
  }
  requestAnimationFrame(drawPreview);
}

/* ---------- detail overlay ---------- */
function openDetail() {
  const ch = channels[state.ch];
  const ev = ch.events[state.ev];
  document.getElementById('dtTitle').textContent = ev.title;
  document.getElementById('dtTimes').textContent =
    `${fmtHM(unitToDate(ev.start))} – ${fmtHM(unitToDate(ev.start + ev.dur))}  ·  CH ${ch.num}`;
  document.getElementById('dtDesc').textContent = ev.desc;
  const sym = document.getElementById('dtSym');
  sym.style.background = genreTint(ev.genre, .18, 55);
  sym.style.color = genreTint(ev.genre, 1, 68);
  sym.innerHTML = genreSVG(ev.genre);
  document.getElementById('dtChips').innerHTML =
    `<span class="chip" style="color:${genreTint(ev.genre,1,70)}">${genreSVG(ev.genre)}</span>`
    + ev.flags.map(f => `<span class="chip">${flagSVG(f)}</span>`).join('');
  document.getElementById('detail').classList.add('on');
  state.detailOpen = true;
  AudioFX.select();
}
function closeDetail() {
  document.getElementById('detail').classList.remove('on');
  state.detailOpen = false;
  AudioFX.back();
}
function tuneToSelection() {
  if (state.tuned !== state.ch) {
    state.tuned = state.ch;
    staticUntil = performance.now() + 280;
    document.getElementById('flash').classList.remove('zap');
    void document.getElementById('flash').offsetWidth;
    document.getElementById('flash').classList.add('zap');
    AudioFX.zap();
  } else {
    AudioFX.chirp();
  }
  closeDetailSilent();
  renderNowPlaying();
}
function closeDetailSilent() {
  document.getElementById('detail').classList.remove('on');
  state.detailOpen = false;
}

document.getElementById('actWatch').addEventListener('click', tuneToSelection);
document.getElementById('actRec').addEventListener('click', () => { AudioFX.chirp(); closeDetail(); });
document.getElementById('actRemind').addEventListener('click', () => { AudioFX.chirp(); closeDetail(); });
document.getElementById('detail').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeDetail();
});

/* ---------- clock ---------- */
function renderClock() {
  const d = new Date();
  const h = d.getHours(), m = String(d.getMinutes()).padStart(2, '0');
  document.getElementById('clock').innerHTML =
    `${String(h).padStart(2,'0')}:${m}<small>${String(d.getSeconds()).padStart(2,'0')}</small>`;
}

/* ---------- navigation ---------- */
function clampSelection() {
  const evs = channels[state.ch].events;
  state.ev = Math.min(Math.max(0, state.ev), evs.length - 1);
}

function moveH(dir) {
  const evs = channels[state.ch].events;
  const ni = state.ev + dir;
  if (ni < 0 || ni >= evs.length) {
    // try scrolling the time window instead
    const nt = state.t0 + dir;
    if (nt >= 0 && nt + VISIBLE_UNITS <= UNITS_TOTAL) { state.t0 = nt; AudioFX.move(); refresh(); }
    else AudioFX.denied();
    return;
  }
  state.ev = ni;
  const ev = evs[state.ev];
  // auto-scroll window to keep selection visible
  if (ev.start < state.t0)
    state.t0 = Math.max(0, ev.start);
  else if (ev.start + Math.min(ev.dur, 1) > state.t0 + VISIBLE_UNITS)
    state.t0 = Math.min(UNITS_TOTAL - VISIBLE_UNITS, ev.start);
  AudioFX.move();
  refresh();
}

function moveV(dir) {
  const nc = state.ch + dir;
  if (nc < 0 || nc >= channels.length) { AudioFX.denied(); return; }
  state.ch = nc;
  // land on the event nearest the current window's focus
  const evs = channels[state.ch].events;
  const focus = Math.max(state.t0, Math.min(nowUnits(), state.t0 + VISIBLE_UNITS - 1));
  let best = 0, bd = 1e9;
  evs.forEach((e, i) => {
    const c = e.start + e.dur / 2;
    const d = Math.abs(c - (state.t0 + VISIBLE_UNITS / 2));
    if (d < bd) { bd = d; best = i; }
  });
  state.ev = best;
  clampSelection();
  AudioFX.moveV();
  refresh();
}

document.addEventListener('keydown', e => {
  AudioFX.unlock();
  if (!state.booted) return;

  if (state.detailOpen) {
    if (e.key === 'Escape' || e.key === 'Backspace' || e.key.toLowerCase() === 'b') closeDetail();
    if (e.key === 'Enter'  || e.key.toLowerCase() === 'a') tuneToSelection();
    e.preventDefault();
    return;
  }

  switch (e.key) {
    case 'ArrowLeft':  moveH(-1); break;
    case 'ArrowRight': moveH(1);  break;
    case 'ArrowUp':    moveV(-1); break;
    case 'ArrowDown':  moveV(1);  break;
    case 'Enter': case 'a': case 'A': openDetail(); break;
    case 'Escape': case 'Backspace': case 'b': case 'B': AudioFX.back(); break;
    case 'x': case 'X': tuneToSelectionFromGrid(); break;
    default: return;
  }
  e.preventDefault();
});

function tuneToSelectionFromGrid() {
  state.tuned = state.ch;
  staticUntil = performance.now() + 280;
  const fl = document.getElementById('flash');
  fl.classList.remove('zap'); void fl.offsetWidth; fl.classList.add('zap');
  AudioFX.zap();
  renderNowPlaying();
}

/* ---------- refresh + boot ---------- */
function refresh() {
  renderTimeslots();
  renderRows();
  renderNowline();
  renderNowPlaying();
}

function boot() {
  // start on the on-air event of channel 1
  state.ev = currentEventIndex(0);
  refresh();
  renderClock();
  drawPreview();

  setInterval(renderClock, 1000);
  setInterval(() => { renderNowline(); renderNowPlaying(); renderTimeslots(); }, 30000);

  // boot chime plays on first interaction if autoplay is blocked
  const playChime = () => { AudioFX.unlock(); AudioFX.boot(); };
  try { playChime(); } catch (e) {}
  document.addEventListener('pointerdown', () => AudioFX.unlock(), { once: true });

  setTimeout(() => {
    document.getElementById('boot').classList.add('done');
    document.getElementById('guide').classList.add('on');
    state.booted = true;
    refresh();
  }, 3600);
}

window.addEventListener('resize', () => { renderRows(); renderNowline(); });
boot();
</script>
</body>
</html>
